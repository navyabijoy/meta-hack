<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report a bug</title>
<link rel="icon" type="image/png" href="/static/brand/logo-64.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<style>
  .rp { max-width: 560px; margin: 56px auto; padding: 0 16px; }
  .rp h1 { font-size: 24px; letter-spacing: -0.01em; margin: 0 0 6px; }
  .rp .lead { color: var(--muted); margin: 0 0 24px; }
  .rp label.f { display: block; font-weight: 600; margin-top: 18px; }
  .rp .hint { color: var(--faint); font-size: 12.5px; font-weight: 400; }
  .rp .drop { margin-top: 8px; }
  .rp .done { text-align: center; padding: 32px 8px; }
  .rp .done h2 { margin: 0 0 8px; }
  .rp .err { color: var(--red); margin-top: 12px; min-height: 1.5em; }
  .rp .tips { margin-top: 20px; color: var(--muted); font-size: 13px; }
  .rp .tips li { margin: 4px 0; }
  .rp .foot { margin-top: 28px; color: var(--faint); font-size: 12px; text-align: center; }
</style>
</head>
<body>
<main class="rp" id="rp">
  <h1 id="h">Report a bug</h1>
  <p class="lead" id="lead">Show us what went wrong. A short screen recording is all we need.</p>
  <form id="form" class="card">
    <label class="f" for="desc">What went wrong?</label>
    <textarea id="desc" rows="3" required placeholder="I clicked Save once and the task was added twice."></textarea>
    <label class="f">Screen recording <span class="hint">MP4 or MOV, up to 300 MB</span></label>
    <label class="drop" id="drop"><input type="file" id="file" accept="video/mp4,video/quicktime,video/*" hidden>
      <div id="dropText">Choose a video, or drop it here</div></label>
    <label class="f" for="who">Your name <span class="hint">optional, shown on the report</span></label>
    <input type="text" id="who" maxlength="100" placeholder="Sam from Support">
    <button class="primary" id="go" type="submit" disabled>Send report</button>
    <div class="err" id="err" role="alert"></div>
    <ul class="tips">
      <li>Start recording from a freshly loaded page if you can.</li>
      <li>Say out loud what you expected to happen. It helps.</li>
    </ul>
  </form>
  <p class="foot">Powered by Gecko · your report becomes a tracked issue for the team</p>
</main>
<script>
const token = location.pathname.split('/').filter(Boolean)[1] // /r/{token}
const $ = (s) => document.querySelector(s)
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])

fetch('/api/report/' + encodeURIComponent(token)).then(async (r) => {
  if (!r.ok) {
    const j = await r.json().catch(() => ({}))
    $('#rp').innerHTML = `<div class="card done"><h2>This link isn't active</h2><p class="lead">${esc(j.detail || 'Ask the team for a new link.')}</p></div>`
    return
  }
  const j = await r.json()
  $('#h').textContent = 'Report a bug in ' + j.project
  if (!j.accepting) $('#err').textContent = 'This project has reached its monthly limit. Your report will still be filed for the team.'
})

let file = null
const pick = (f) => {
  if (!f) return
  file = f
  $('#dropText').textContent = f.name + ' · ' + (f.size / 1e6).toFixed(1) + ' MB'
  $('#drop').classList.add('has')
  $('#go').disabled = !$('#desc').value.trim()
}
$('#file').onchange = () => pick($('#file').files[0])
$('#drop').ondragover = (e) => e.preventDefault()
$('#drop').ondrop = (e) => { e.preventDefault(); pick(e.dataTransfer.files[0]) }
$('#desc').oninput = () => { $('#go').disabled = !(file && $('#desc').value.trim()) }

$('#form').onsubmit = async (e) => {
  e.preventDefault()
  $('#go').disabled = true
  $('#go').textContent = 'Sending…'
  $('#err').textContent = ''
  const fd = new FormData()
  fd.append('video', file)
  fd.append('description', $('#desc').value)
  fd.append('reporter', $('#who').value)
  const r = await fetch('/api/report/' + encodeURIComponent(token), { method: 'POST', body: fd })
  const j = await r.json().catch(() => ({}))
  if (!r.ok) {
    $('#err').textContent = j.detail || 'Something went wrong. Try again.'
    $('#go').disabled = false
    $('#go').textContent = 'Send report'
    return
  }
  $('#rp').innerHTML = `<div class="card done">
    <h2>Thanks, it's with the team</h2>
    <p class="lead">Gecko filed your report and is reproducing it now. If it can prove the bug, the team gets a fix to review.</p>
    <p><a href="${esc(j.issue_url)}" target="_blank" rel="noopener">View the report on GitHub</a></p></div>`
}
</script>
</body>
</html>
