<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Gecko</title>
<link rel="icon" type="image/png" href="/static/brand/logo-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>try { const t = localStorage.getItem('gecko.theme'); if (t) document.documentElement.dataset.theme = t } catch {}</script>
<style>
:root { --bg: #f1eee7; --panel: #fbfaf7; --ink: #1c1917; --muted: #78716c; --faint: #a8a29e; --line: #e4e0d8; --red: #ef4444; --bad: #dc2626; --bad-soft: #fbe9e9; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0d0b0a; --panel: #161311; --ink: #f5f3ee; --muted: #a8a29e; --faint: #78716c; --line: #2a2522; --bad: #f87171; --bad-soft: #2a1414; } }
:root[data-theme="dark"] { --bg: #0d0b0a; --panel: #161311; --ink: #f5f3ee; --muted: #a8a29e; --faint: #78716c; --line: #2a2522; --bad: #f87171; --bad-soft: #2a1414; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink);
  font: 14px/1.55 Geist, system-ui, sans-serif; -webkit-font-smoothing: antialiased; letter-spacing: -0.005em;
  background-image: radial-gradient(circle at 50% -10%, color-mix(in srgb, var(--red) 10%, transparent), transparent 45%); }
.box { width: min(400px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 34px 30px 28px; text-align: center;
  box-shadow: 0 1px 2px rgba(28,25,23,.04), 0 24px 60px -30px rgba(28,25,23,.3); }
.logo { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; font-size: 18px; letter-spacing: -0.02em; margin-bottom: 26px; color: inherit; text-decoration: none; }
.logo img { border-radius: 8px; display: block; }
h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.03em; margin: 0 0 6px; }
p { color: var(--muted); margin: 0 0 24px; }
.gh { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 12px 16px; border-radius: 12px; border: 0; background: var(--ink); color: var(--bg);
  font: 600 14.5px Geist, sans-serif; cursor: pointer; text-decoration: none; transition: transform .15s, opacity .15s; }
.gh:hover { transform: translateY(-1px); opacity: .92; }
.gh svg { width: 19px; height: 19px; fill: currentColor; }
.err { background: var(--bad-soft); color: var(--bad); border-radius: 10px; padding: 9px 12px; font-size: 13px; margin: 0 0 16px; text-align: left; }
.fine { color: var(--faint); font-size: 12.5px; margin: 18px 0 0; line-height: 1.5; }
.fine a { color: var(--muted); }
.dev { font: 12px "Geist Mono", monospace; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; padding: 9px 12px; margin: 0 0 16px; }
</style>
</head>
<body>
<main class="box">
  <a class="logo" href="/"><img src="/static/brand/logo.svg" alt="" width="30" height="30">Gecko</a>
  <h1>Sign in to Gecko</h1>
  <p>See the bugs Gecko caught in your repositories.</p>
  <div id="msg"></div>
  <a class="gh" id="go" href="/auth/login"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .5a11.5 11.5 0 0 0-3.6 22.4c.6.1.8-.3.8-.6v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.2 1.2a11 11 0 0 1 5.8 0c2.2-1.5 3.2-1.2 3.2-1.2.6 1.6.2 2.8.1 3.1.8.8 1.2 1.9 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.2c0 .3.2.7.8.6A11.5 11.5 0 0 0 12 .5Z"/></svg>Continue with GitHub</a>
  <p class="fine">You'll see the repositories you can access on GitHub that have Gecko installed. Gecko never asks for your password.</p>
</main>
<script>
const params = new URLSearchParams(location.search)
const next = params.get('next') || '/workspace'
document.getElementById('go').href = '/auth/login?next=' + encodeURIComponent(next)
const msg = document.getElementById('msg')
const err = params.get('error')
if (err) {
  const d = document.createElement('div')
  d.className = 'err'
  d.textContent = err === 'access_denied' || err === 'cancelled' ? 'Sign-in was cancelled.' : err
  msg.appendChild(d)
}
fetch('/api/workspace/me').then((r) => r.json()).then((me) => {
  if (me.signed_in) location.replace(next)
  if (!me.auth_enabled) {
    const d = document.createElement('div')
    d.className = 'dev'
    d.textContent = 'Sign-in is not switched on for this server yet, so the workspace is open.'
    msg.appendChild(d)
    document.getElementById('go').textContent = 'Open the workspace'
    document.getElementById('go').href = next
  }
}).catch(() => {})
</script>
</body>
</html>
